# Проверка PR draft → main: те же проверки и чистовая сборка, что перед публикацией.
# Положить в .github/workflows/check.yml. В защите ветки main можно сделать «Проверка» обязательной.
name: Проверка

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Проверки
        run: python3 -m unittest discover tests -v
      - name: Чистовая сборка
        run: python3 build.py
